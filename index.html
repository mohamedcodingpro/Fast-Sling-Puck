<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Sling Puck Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1 role="heading" aria-level="1">Fast Sling Puck</h1>
        <div id="scoreboard" role="status">
            <span>Player 1: <span id="score1">0</span></span>
            <span>Player 2: <span id="score2">0</span></span>
        </div>
    </header>

    <main id="game-container" role="application">
        <section class="player-side" aria-labelledby="player1-label">
            <div class="goal-slot" id="player1-slot"></div>
            <div class="puck-area" id="player1-pucks" aria-describedby="player1-instructions"></div>
        </section>

        <div class="divider-container">
            <div class="divider">
                <div class="elastic-band"></div>
            </div>
        </div>

        <section class="player-side" aria-labelledby="player2-label">
            <div class="puck-area" id="player2-pucks" aria-describedby="player2-instructions"></div>
            <div class="goal-slot" id="player2-slot"></div>
        </section>
    </main>

    <button id="restart-btn" class="wooden-button" aria-label="Restart Game">
        <span class="button-text">Restart Game</span>
    </button>

    <script src="app.js"></script>
</body>
</html>
