<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Sling Puck Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Fast Sling Puck</h1>

    <div id="scoreboard">
        <span>Player 1: <span id="score1">0</span></span>
        <span>Player 2: <span id="score2">0</span></span>
    </div>

    <div id="game-container">
        <div class="side">
            <div class="goal-slot" id="player1-slot"></div>
            <div class="puck-area" id="player1-pucks"></div>
        </div>

        <div id="board-center">
            <div class="divider">
                <div class="elastic-band"></div>
            </div>
        </div>

        <div class="side">
            <div class="puck-area" id="player2-pucks"></div>
            <div class="goal-slot" id="player2-slot"></div>
        </div>
    </div>

    <button id="restart-btn">Restart Game</button>

    <script src="app.js"></script>
</body>
</html>
